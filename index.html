<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Up & Joki Game Terpercaya</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-4xl w-full text-center">
        <h1 class="text-3xl md:text-4xl font-bold mb-2">Pilih Game Favorit Kamu</h1>
        <p class="text-slate-400 mb-8">Silakan pilih game di bawah untuk melakukan top-up atau request akun.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Mobile Legends -->
            <div onclick="location.href='pages/mobile-legends.html'" class="bg-slate-800 p-6 rounded-xl border border-slate-700 hover:border-blue-500 cursor-pointer transition transform hover:-translate-y-1">
                <div class="h-32 bg-blue-600 rounded-lg mb-4 flex items-center justify-center text-xl font-bold">MLBB</div>
                <h2 class="text-xl font-semibold">Mobile Legends</h2>
                <p class="text-slate-400 text-sm mt-1">Diamond & Starlight Member</p>
            </div>
            
            <!-- Free Fire -->
            <div onclick="location.href='pages/free-fire.html'" class="bg-slate-800 p-6 rounded-xl border border-slate-700 hover:border-orange-500 cursor-pointer transition transform hover:-translate-y-1">
                <div class="h-32 bg-orange-600 rounded-lg mb-4 flex items-center justify-center text-xl font-bold">FF</div>
                <h2 class="text-xl font-semibold">Free Fire</h2>
                <p class="text-slate-400 text-sm mt-1">Diamond & Membership</p>
            </div>
            
            <!-- PES -->
            <div onclick="location.href='pages/pes.html'" class="bg-slate-800 p-6 rounded-xl border border-slate-700 hover:border-green-500 cursor-pointer transition transform hover:-translate-y-1">
                <div class="h-32 bg-green-600 rounded-lg mb-4 flex items-center justify-center text-xl font-bold">PES</div>
                <h2 class="text-xl font-semibold">eFootball PES</h2>
                <p class="text-slate-400 text-sm mt-1">Koin & Jasa Akun</p>
            </div>
        </div>
    </div>
</body>
</html>
